<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Form Trong HTML</h2>

    <table>
        <form>
            <tr>
                <td><label for="">Username</label></td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td><label for="">Password</label></td>
                <td>
                    <input type="password">
                </td>
            </tr>
            <tr>
                <td><label for="">Web server</label></td>
                <td>
                    <select>
                        <option>Vietnam</option>
                        <option>Singapore</option>
                        <option>US</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="">Choose role</label></td>
                <td>
                    <label><input name="role" type="radio">IT</label>
                    <label><input name="role" type="radio">Dev</label>
                    <label><input name="role" type="radio">BA</label>
                </td>
            </tr>

            <tr>
                <td><label for="">Pick a date</label></td> 
                <td><input type="date"></td>
            </tr>
            <tr>
                <td>Pick a color</td>
                <td><input type="color"></td>
            </tr>
            <tr>
                <td><label for="">Enter your age</label></td>
                <td><input type="number"></td>
            </tr>
            <tr>
                <td>Introduction</td>
                <td><textarea></textarea></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Send data">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
